allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

// Inyección limpia y compatible con Gradle 8.11.1+
subprojects { project ->
    if (project.name == "flutter_tflite") {
        project.plugins.withId("com.android.library") {
            project.android.namespace = "sq.flutter.tflite"
        }
    }

    project.plugins.configureEach { plugin ->
        if (plugin.class.name.contains("com.android.build.gradle.BasePlugin")) {
            project.extensions.configure("android") { android ->
                if (android.namespace == null) {
                    android.namespace = "com.example.fallback." + project.name.replace("-", "_")
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}