name: lungs_pneumonia_ai
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.6 <3.0.0'
dependencies:
  flutter:
    sdk: flutter
    
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_screenutil: ^5.9.0 #5.7.0
  flutter_svg: ^2.0.5
  carousel_slider: ^5.0.0
  get: ^4.6.6
  image_picker: ^0.8.7+4
  lottie: ^3.3.0
  flutter_tflite: ^1.0.1 #tflite: ^1.1.2
  archive: ^3.6.1  # <-- Añade o actualiza esta línea con esta versión exacta
  dio: ^5.4.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/tflite/
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/json/

  fonts:
    - family: Roboto
      fonts:
      - asset: assets/fonts/Roboto-Regular.ttf
        weight: 400
      - asset: assets/fonts/Roboto-Medium.ttf
        weight: 500
      - asset: assets/fonts/Roboto-Bold.ttf
        weight: 700    